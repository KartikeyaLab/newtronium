<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Cognitive Flow | High-Speed Mastery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@400;600&family=Lexend:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0256d2",
              primary_container: "#4880fd",
              surface: "#f3faff",
              secondary: "#006e2d",
              on_surface: "#003748",
              on_surface_variant: "#366578",
              surface_container_lowest: "#ffffff",
              surface_container_low: "#e6f6ff",
              surface_container: "#d9f2ff",
              surface_container_high: "#cbedff",
              surface_container_highest: "#bce9ff",
            },
            fontFamily: {
              headline: ["Space Grotesk", "sans-serif"],
              body: ["Inter", "sans-serif"],
              label: ["Lexend", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #f3faff;
        color: #003748;
        overflow: hidden;
      }
      .glass {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .primary-gradient {
        background: linear-gradient(135deg, #0256d2 0%, #4880fd 100%);
      }
      input:focus {
        outline: none;
      }
      .hidden-section {
        display: none !important;
      }
      input::-webkit-inner-spin-button,
      input::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      @keyframes correct-flash {
        0% {
          background-color: #f3faff;
        }
        50% {
          background-color: #e9ffe6;
        }
        100% {
          background-color: #f3faff;
        }
      }
      .flash-success {
        animation: correct-flash 0.4s ease-out;
      }
    </style>
  </head>
  <body class="font-body selection:bg-primary_container selection:text-white">
    <div
      id="auth-screen"
      class="fixed inset-0 z-[100] bg-surface flex items-center justify-center p-6"
    >
      <div class="max-w-sm w-full space-y-10 text-center">
        <div class="space-y-2">
          <h1 class="font-headline text-5xl font-bold tracking-tighter">
            Newtronium<span class="text-primary italic"> Math</span>
          </h1>
          <p
            class="font-label text-xs text-on_surface_variant uppercase tracking-widest"
          >
            Meditation for Mathematicians
          </p>
        </div>
        <div class="space-y-4">
          <input
            type="text"
            id="username-input"
            placeholder="Neural Identity"
            class="w-full bg-surface_container_highest rounded-2xl py-5 px-6 text-center font-label text-lg focus:bg-white transition-all border-none shadow-sm"
          />
          <button
            onclick="initUser()"
            class="primary-gradient w-full py-5 rounded-full text-white font-label font-bold text-lg shadow-xl active:scale-95 transition-transform"
          >
            Begin Training
          </button>
        </div>
      </div>
    </div>

    <div id="app-shell" class="hidden-section min-h-screen flex flex-col">
      <div
        id="dashboard"
        class="flex-1 max-w-5xl mx-auto w-full px-6 py-12 space-y-16"
      >
        <header class="flex justify-between items-center">
          <div class="flex items-center gap-5">
            <div
              class="w-14 h-14 rounded-2xl bg-primary text-white flex items-center justify-center font-headline font-bold text-2xl shadow-lg"
              id="avatar"
            >
              K
            </div>
            <div>
              <h2 class="font-headline text-3xl font-bold" id="display-name">
                User
              </h2>
              <p
                class="font-label text-[10px] text-on_surface_variant uppercase tracking-[0.2em]"
                id="rank-label"
              >
                Level 1
              </p>
            </div>
          </div>
          <div
            class="bg-surface_container_low p-4 rounded-2xl text-center min-w-[100px]"
          >
            <p
              class="text-[9px] font-label uppercase text-on_surface_variant mb-1"
            >
              Total XP
            </p>
            <p
              class="font-headline font-bold text-xl text-primary"
              id="total-xp"
            >
              0
            </p>
          </div>
        </header>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <div class="space-y-6">
            <h3
              class="font-headline text-xl font-bold opacity-40 uppercase tracking-widest"
            >
              Neural Modes
            </h3>
            <div class="grid grid-cols-2 gap-4">
              <button
                onclick="setMode('×')"
                class="mode-card group p-6 rounded-3xl bg-surface_container_highest ring-2 ring-primary transition-all flex flex-col items-center"
              >
                <span
                  class="material-symbols-outlined text-3xl mb-2 text-primary"
                  >close</span
                >
                <span class="font-label font-bold text-sm">Multiply</span>
              </button>
              <button
                onclick="setMode('+')"
                class="mode-card group p-6 rounded-3xl bg-surface_container_low hover:bg-surface_container_high transition-all flex flex-col items-center"
              >
                <span
                  class="material-symbols-outlined text-3xl mb-2 text-on_surface_variant"
                  >add</span
                >
                <span class="font-label font-bold text-sm">Add</span>
              </button>
              <button
                onclick="setMode('-')"
                class="mode-card group p-6 rounded-3xl bg-surface_container_low hover:bg-surface_container_high transition-all flex flex-col items-center"
              >
                <span
                  class="material-symbols-outlined text-3xl mb-2 text-on_surface_variant"
                  >remove</span
                >
                <span class="font-label font-bold text-sm">Subtract</span>
              </button>
              <button
                onclick="setMode('÷')"
                class="mode-card group p-6 rounded-3xl bg-surface_container_low hover:bg-surface_container_high transition-all flex flex-col items-center"
              >
                <span
                  class="material-symbols-outlined text-3xl mb-2 text-on_surface_variant"
                  >percent</span
                >
                <span class="font-label font-bold text-sm">Divide</span>
              </button>
              <button
                onclick="setMode('²')"
                class="mode-card group p-6 rounded-3xl bg-surface_container_low hover:bg-surface_container_high transition-all flex flex-col items-center"
              >
                <span
                  class="material-symbols-outlined text-3xl mb-2 text-on_surface_variant"
                  >looks_two</span
                >
                <span class="font-label font-bold text-sm">Squares</span>
              </button>

              <button
                onclick="setMode('³')"
                class="mode-card group p-6 rounded-3xl bg-surface_container_low hover:bg-surface_container_high transition-all flex flex-col items-center"
              >
                <span
                  class="material-symbols-outlined text-3xl mb-2 text-on_surface_variant"
                  >looks_3</span
                >
                <span class="font-label font-bold text-sm">Cubes</span>
              </button>
            </div>
          </div>

          <div
            class="bg-surface_container_lowest p-8 rounded-[2.5rem] border border-outline_variant flex flex-col justify-between"
          >
            <div>
              <h3 class="font-headline text-xl font-bold mb-2">
                Neural Sharpness
              </h3>
              <p class="text-sm text-on_surface_variant mb-6">
                Historical data sync.
              </p>
            </div>
            <div id="history-track" class="space-y-4">
              <p class="text-xs italic opacity-30">
                No neural data recorded yet.
              </p>
            </div>
          </div>
        </section>

        <button
          onclick="launchSession()"
          class="primary-gradient w-full py-10 rounded-[2rem] text-white font-label font-bold text-3xl shadow-xl hover:scale-[1.01] active:scale-[0.98] transition-all"
        >
          Enter Flow State
        </button>
      </div>

      <div
        id="practice"
        class="hidden-section flex-1 flex flex-col bg-surface transition-colors duration-500"
      >
        <nav class="p-8 flex justify-between items-center">
          <button
            onclick="abortSession()"
            class="group flex items-center gap-3 text-on_surface_variant"
          >
            <span
              class="material-symbols-outlined group-hover:-translate-x-1 transition-transform"
              >west</span
            >
            <span class="font-label text-sm font-bold">Disconnect</span>
          </button>
          <div class="flex items-center gap-6">
            <div class="text-right">
              <p class="text-[9px] font-label uppercase opacity-40">Live APM</p>
              <p class="font-headline font-bold text-xl" id="live-apm">0.0</p>
            </div>
            <div
              class="bg-primary text-white px-6 py-2 rounded-full font-headline font-bold text-lg"
              id="timer"
            >
              00:00
            </div>
          </div>
        </nav>
        <main class="flex-1 flex flex-col items-center justify-center px-6">
          <div
            id="equation"
            class="font-headline text-[8rem] md:text-[12rem] font-bold tracking-tighter leading-none mb-8"
          >
            --
          </div>
          <input
            type="number"
            id="answer-input"
            autocomplete="off"
            class="w-full max-w-sm bg-surface_container_highest rounded-3xl py-10 text-center font-headline text-7xl focus:bg-white"
            placeholder="·"
          />
        </main>
        <div class="p-12 flex justify-center">
          <div class="flex gap-2" id="streak-dots"></div>
        </div>
      </div>
    </div>

    <div
      id="result-overlay"
      class="hidden-section fixed inset-0 z-[200] glass flex items-center justify-center p-6"
    >
      <div
        class="bg-white p-12 rounded-[3rem] shadow-2xl max-w-md w-full text-center space-y-8"
      >
        <h3 class="font-headline text-4xl font-bold">Flow Anchored</h3>
        <div class="grid grid-cols-2 gap-4">
          <div class="bg-surface_container_low p-6 rounded-3xl">
            <p class="text-3xl font-bold" id="res-apm">0.0</p>
            <p class="text-[9px] uppercase">APM</p>
          </div>
          <div class="bg-surface_container_low p-6 rounded-3xl">
            <p class="text-3xl font-bold text-primary" id="res-xp">+0</p>
            <p class="text-[9px] uppercase">XP</p>
          </div>
        </div>
        <button
          onclick="dismissResults()"
          class="primary-gradient w-full py-6 rounded-full text-white font-bold"
        >
          Return to Base
        </button>
      </div>
    </div>
    <script>
      let state = {
        user: { name: "", xp: 0, history: [] },
        session: {
          active: false,
          mode: "×",
          currentAns: 0,
          correctCount: 0,
          target: 10,
          startTime: null,
          timerRef: null,
        },
      };

      const elements = {
        auth: document.getElementById("auth-screen"),
        app: document.getElementById("app-shell"),
        dash: document.getElementById("dashboard"),
        practice: document.getElementById("practice"),
        input: document.getElementById("answer-input"),
        equation: document.getElementById("equation"),
        timer: document.getElementById("timer"),
        apm: document.getElementById("live-apm"),
        overlay: document.getElementById("result-overlay"),
      };

      window.onload = function () {
        const lastUser = localStorage.getItem("cf_last_session_user");
        if (lastUser) {
          autoLogin(lastUser);
        }
      };

      function autoLogin(name) {
        const saved = localStorage.getItem("cf_user_" + name);
        state.user = saved ? JSON.parse(saved) : { name, xp: 0, history: [] };

        elements.auth.classList.add("hidden-section");
        elements.app.classList.remove("hidden-section");
        updateDashboard();
      }

      function initUser() {
        const name = document.getElementById("username-input").value.trim();
        if (!name) return;

        localStorage.setItem("cf_last_session_user", name);

        autoLogin(name);
      }

      function updateDashboard() {
        document.getElementById("display-name").innerText = state.user.name;
        document.getElementById("avatar").innerText =
          state.user.name[0].toUpperCase();
        document.getElementById("total-xp").innerText =
          state.user.xp.toLocaleString();
        const hist = document.getElementById("history-track");
        hist.innerHTML = state.user.history.length
          ? state.user.history
              .slice(-3)
              .reverse()
              .map(
                (h) => `
      <div class="flex justify-between items-center p-4 bg-surface rounded-2xl">
        <span class="font-label text-sm">${h.mode}</span>
        <span class="font-headline font-bold text-secondary">${h.apm} APM</span>
      </div>`,
              )
              .join("")
          : `<p class="text-xs italic opacity-30">No neural data recorded yet.</p>`;
      }

      function setMode(m) {
        state.session.mode = m;
        document.querySelectorAll(".mode-card").forEach((c) => {
          c.classList.remove(
            "ring-2",
            "ring-primary",
            "bg-surface_container_highest",
          );
          c.classList.add("bg-surface_container_low");
          c.querySelector("span:first-child").classList.replace(
            "text-primary",
            "text-on_surface_variant",
          );
        });
        const btn = event.currentTarget;
        btn.classList.add(
          "ring-2",
          "ring-primary",
          "bg-surface_container_highest",
        );
        btn
          .querySelector("span:first-child")
          .classList.replace("text-on_surface_variant", "text-primary");
      }

      function launchSession() {
        elements.dash.classList.add("hidden-section");
        elements.practice.classList.remove("hidden-section");
        state.session.active = true;
        state.session.correctCount = 0;
        state.session.startTime = Date.now();
        generateQuestion();
        updateDots();
        state.session.timerRef = setInterval(tick, 100);
        setTimeout(() => elements.input.focus(), 100);
      }

      function tick() {
        const elapsed = (Date.now() - state.session.startTime) / 1000;
        elements.timer.innerText = `${Math.floor(elapsed / 60)
          .toString()
          .padStart(2, "0")}:${Math.floor(elapsed % 60)
          .toString()
          .padStart(2, "0")}`;
        if (state.session.correctCount > 0)
          elements.apm.innerText = (
            state.session.correctCount /
            (elapsed / 60)
          ).toFixed(1);
      }

      function generateQuestion() {
        const scale = 5 + state.session.correctCount * 2;
        let a, b;
        const mode = state.session.mode;

        if (mode === "×") {
          a = Math.floor(Math.random() * scale) + 2;
          b = Math.floor(Math.random() * 12) + 2;
          state.session.currentAns = a * b;
        } else if (mode === "+") {
          a = Math.floor(Math.random() * (scale * 5)) + 5;
          b = Math.floor(Math.random() * (scale * 5)) + 5;
          state.session.currentAns = a + b;
        } else if (mode === "-") {
          a = Math.floor(Math.random() * (scale * 5)) + 10;
          b = Math.floor(Math.random() * a) + 2;
          state.session.currentAns = a - b;
        } else if (mode === "÷") {
          b = Math.floor(Math.random() * 10) + 2;
          state.session.currentAns = Math.floor(Math.random() * 10) + 2;
          a = b * state.session.currentAns;
        } else if (mode === "²") {
          a = Math.floor(Math.random() * 25) + 2;
          b = 2;
          state.session.currentAns = Math.pow(a, b);
        } else if (mode === "³") {
          a = Math.floor(Math.random() * 12) + 2;
          b = 3;
          state.session.currentAns = Math.pow(a, b);
        }

        if (["²", "³"].includes(mode)) {
          elements.equation.innerHTML = `${a}<sup class="text-primary text-6xl">${b}</sup>`;
        } else {
          elements.equation.innerHTML = `${a} <span class="text-primary">${mode}</span> ${b}`;
        }
        elements.input.value = "";
      }

      elements.input.addEventListener("input", (e) => {
        if (parseInt(e.target.value) === state.session.currentAns) {
          state.session.correctCount++;
          updateDots();
          elements.practice.classList.add("flash-success");
          setTimeout(
            () => elements.practice.classList.remove("flash-success"),
            400,
          );
          if (state.session.correctCount >= state.session.target) endSession();
          else generateQuestion();
        }
      });

      function updateDots() {
        const container = document.getElementById("streak-dots");
        container.innerHTML = "";
        for (let i = 0; i < state.session.target; i++) {
          const dot = document.createElement("div");
          dot.className = `w-2 h-2 rounded-full transition-all duration-500 ${i < state.session.correctCount ? "bg-secondary w-6" : "bg-surface_container_highest"}`;
          container.appendChild(dot);
        }
      }

      function endSession() {
        clearInterval(state.session.timerRef);
        const finalApm = (
          state.session.target /
          ((Date.now() - state.session.startTime) / 60000)
        ).toFixed(1);
        const xpGain = Math.round(finalApm * 10);
        state.user.xp += xpGain;
        state.user.history.push({ mode: state.session.mode, apm: finalApm });
        localStorage.setItem(
          "cf_user_" + state.user.name,
          JSON.stringify(state.user),
        );
        document.getElementById("res-apm").innerText = finalApm;
        document.getElementById("res-xp").innerText = `+${xpGain}`;
        elements.overlay.classList.remove("hidden-section");
      }

      function dismissResults() {
        elements.overlay.classList.add("hidden-section");
        elements.practice.classList.add("hidden-section");
        elements.dash.classList.remove("hidden-section");
        updateDashboard();
      }

      function abortSession() {
        if (confirm("Abort neural sync?")) {
          clearInterval(state.session.timerRef);
          elements.practice.classList.add("hidden-section");
          elements.dash.classList.remove("hidden-section");
        }
      }

      function updateDashboard() {
        const user = state.user;

        const currentLevel = Math.floor(user.xp / 1000) + 1;

        document.getElementById("display-name").innerText = user.name;
        document.getElementById("avatar").innerText =
          user.name[0].toUpperCase();
        document.getElementById("total-xp").innerText =
          user.xp.toLocaleString();

        document.getElementById("rank-label").innerText =
          `Initiate Level ${currentLevel}`;

        const hist = document.getElementById("history-track");
        hist.innerHTML = user.history.length
          ? user.history
              .slice(-3)
              .reverse()
              .map(
                (h) => `
    <div class="flex justify-between items-center p-4 bg-surface rounded-2xl">
      <span class="font-label text-sm">${h.mode}</span>
      <span class="font-headline font-bold text-secondary">${h.apm} APM</span>
    </div>`,
              )
              .join("")
          : `<p class="text-xs italic opacity-30">No neural data recorded yet.</p>`;
      }
    </script>
  </body>
</html>
